{{- if eq (.Values.podDisruptionBudget.enabled | quote | lower) "\"true\"" }}
  {{- $minReplicas := $.Values.autoscaling.minReplicas }}
  {{- $maxUnavailable := sub $minReplicas 1 }}
  {{- if gt $maxUnavailable 0 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qtest-insights-pdb
  namespace: {{ $.Values.namespace.name }}
spec:
  maxUnavailable: {{ $maxUnavailable }}
  selector:
    matchLabels:
      app: qtest-insights
      release: {{ $.Release.Name }}
---
  {{- else }}
  {{- /* minReplicas <= 1: allow full disruption so node drains/GKE upgrades are not blocked.
       If insights must survive maintenance windows, raise minReplicas to 2+. */}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qtest-insights-pdb
  namespace: {{ $.Values.namespace.name }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: qtest-insights
      release: {{ $.Release.Name }}
---
  {{- end }}
{{- end }}
