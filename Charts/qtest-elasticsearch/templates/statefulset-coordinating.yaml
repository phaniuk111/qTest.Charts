{{- if gt (int .Values.coordinating.replicas) 0 }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.service.name }}-coordinating
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "qtest-elasticsearch.labels" . | nindent 4 }}
    elasticsearch.role: coordinating
spec:
  serviceName: {{ .Values.service.name }}-coordinating-headless
  replicas: {{ .Values.coordinating.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "qtest-elasticsearch.selectorLabels" . | nindent 6 }}
      elasticsearch.role: coordinating
  template:
    metadata:
      labels:
        {{- include "qtest-elasticsearch.selectorLabels" . | nindent 8 }}
        elasticsearch.role: coordinating
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        traffic.sidecar.istio.io/excludeOutboundPorts: "9300"
        traffic.sidecar.istio.io/excludeInboundPorts: "9300"
    spec:
      securityContext:
        fsGroup: {{ .Values.coordinating.podSecurityContext.fsGroup }}
        runAsUser: {{ .Values.coordinating.podSecurityContext.runAsUser }}
        runAsNonRoot: {{ .Values.coordinating.podSecurityContext.runAsNonRoot }}
      terminationGracePeriodSeconds: 120
      containers:
        - name: elasticsearch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: transport
              containerPort: {{ .Values.service.transportPort }}
              protocol: TCP
          env:
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: node.roles
              value: ""
            - name: ES_JAVA_OPTS
              value: "-Xms{{ .Values.coordinating.heapSize }} -Xmx{{ .Values.coordinating.heapSize }}"
            {{- if not .Values.security.enabled }}
            - name: xpack.security.enabled
              value: "false"
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
              readOnly: true
          resources:
            {{- toYaml .Values.coordinating.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: {{ .Values.service.name }}-config
      {{- with .Values.coordinating.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.coordinating.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.coordinating.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
