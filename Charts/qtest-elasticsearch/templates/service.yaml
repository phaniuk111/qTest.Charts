    {{- include "qtest-elasticsearch.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "qtest-elasticsearch.selectorLabels" . | nindent 4 }}
    elasticsearch.role: data
  ports:
