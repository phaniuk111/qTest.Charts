      targetPort: transport
      protocol: TCP
{{- if gt (int .Values.coordinating.replicas) 0 }}
---
## ── Headless service for coordinating node stable DNS ───────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}-coordinating-headless
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "qtest-elasticsearch.labels" . | nindent 4 }}
spec:
