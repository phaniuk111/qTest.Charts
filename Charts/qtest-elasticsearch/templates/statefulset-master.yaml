apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.service.name }}-master
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "qtest-elasticsearch.labels" . | nindent 4 }}
    elasticsearch.role: master
spec:
  serviceName: {{ .Values.service.name }}-master-headless
  replicas: {{ .Values.master.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "qtest-elasticsearch.selectorLabels" . | nindent 6 }}
      elasticsearch.role: master
  template:
    metadata:
      labels:
        {{- include "qtest-elasticsearch.selectorLabels" . | nindent 8 }}
        elasticsearch.role: master
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        traffic.sidecar.istio.io/excludeOutboundPorts: "9300"
        traffic.sidecar.istio.io/excludeInboundPorts: "9300"
    spec:
      securityContext:
        fsGroup: {{ .Values.master.podSecurityContext.fsGroup }}
        runAsUser: {{ .Values.master.podSecurityContext.runAsUser }}
        runAsNonRoot: {{ .Values.master.podSecurityContext.runAsNonRoot }}
      terminationGracePeriodSeconds: 120
      {{- if .Values.initSysctl.enabled }}
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
            runAsUser: 0
      {{- end }}
      containers:
        - name: elasticsearch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: transport
              containerPort: {{ .Values.service.transportPort }}
              protocol: TCP
          env:
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: node.roles
              value: "master"
            - name: ES_JAVA_OPTS
              value: "-Xms{{ .Values.master.heapSize }} -Xmx{{ .Values.master.heapSize }}"
            {{- if not .Values.security.enabled }}
            - name: xpack.security.enabled
              value: "false"
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
              readOnly: true
            - name: data
              mountPath: /usr/share/elasticsearch/data
          resources:
            {{- toYaml .Values.master.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: {{ .Values.service.name }}-config
        {{- if not .Values.master.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.master.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.master.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.master.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.master.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ {{ .Values.master.persistence.accessMode | quote }} ]
        {{- if .Values.master.persistence.storageClass }}
        storageClassName: {{ .Values.master.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.master.persistence.size }}
  {{- end }}
