qtest-insights-etl:
  enabled: true
  serviceAccount:
    create: true
    automountsatoken: true
    annotations:
      iam.gke.io/gcp-service-account: "SA_NAME@PROJECT_ID.iam.gserviceaccount.com"  # TODO: replace
  autoscaling:
    minReplicas: 1
    maxReplicas: 2

  qTestInsightsEtl:
    qTestInsightsEtlDBHost: "CLOUD_SQL_PRIVATE_IP"         # TODO: replace
    qTestInsightsEtlDBUser: "qtest_user"
    qTestInsightsEtlWriteQTestDBHost: "CLOUD_SQL_PRIVATE_IP"   # TODO: replace
    qTestInsightsEtlWriteQTestDBUser: "qtest_user"
    qTestInsightsEtlSessionDBHost: "CLOUD_SQL_PRIVATE_IP"      # TODO: replace
    qTestInsightsEtlSessionDBUser: "qtest_user"
    writeSessionsDBHost: "CLOUD_SQL_PRIVATE_IP"                # TODO: replace
    writeSessionsDBUser: "qtest_user"
