# GKE Specific Values for qTest Manager
# ──────────────────────────────────────
# Usage:
#   helm dependency update .
#   helm upgrade --install qtest . -f values-gke-custom.yaml -n qtest
#
# Prerequisites:
#   - GKE cluster with Workload Identity enabled
#   - Cloud SQL PostgreSQL instance with Private IP enabled
#   - VPC peering between GKE VPC and Cloud SQL (automatic when Private IP is enabled)
#   - Istio/ASM with Gateway resource configured in the cluster
#   - Elasticsearch deployed first (via ECK operator or Charts/qtest-elasticsearch)
#   - External Secrets Operator installed in the cluster
#
# Database connectivity:
#   Pods connect directly to Cloud SQL via its Private IP address.
#   No Cloud SQL Auth Proxy sidecar is needed — authentication is
#   username/password via the qtest-manager-secret (managed by ESO).
#
# Required PostgreSQL databases (created by the qtest_user superuser):
#   qtest, sessions, parameters, pulse, scenario
#
# ⚠️ CRITICAL STORAGE REQUIREMENT ⚠️
# qTest Manager uses `ReadWriteMany` PVCs to share attachments across scaled pods.
# GKE's default Persistent Disks (GCE PD) DO NOT support `ReadWriteMany`.
# You MUST either:
#   A) Provision a Filestore (NFS) instance and provide its StorageClass in `persistence.storageClass`.
#   B) Use `blobStorage.type: amazon_s3` with GCS interoperability keys.
#
# Secrets are managed by External Secrets Operator (ESO) pulling from
# Google Secret Manager. See externalSecrets section below.
# The ESO controller's KSA must be bound to a GSA with
# roles/secretmanager.secretAccessor on all referenced secrets.
#
# REQUIRED - DNS:
#   Map these domains to your Istio Ingress Gateway's ILB IP:
#   - qtest.gke.example.com
#   - launch.gke.example.com
#   - insights.gke.example.com
#   - parameters.gke.example.com
#   - scenario.gke.example.com
#   - sessions.gke.example.com
#   - pulse.gke.example.com

# ── Elasticsearch (standalone chart — deploy Charts/qtest-elasticsearch FIRST) ─
# ES is no longer a subchart of qtest-mgr. Deploy it separately:
#   cd Charts/qtest-elasticsearch
#   helm upgrade --install qtest-elasticsearch . -f values.yaml -f values-gke.yaml -n qtest
#
# The ES cluster will be reachable at: qtest-elasticsearch.qtest.svc.cluster.local:9200

# ── ServiceAccount (Workload Identity) ───────────────────────────────
# WI is used by ESO to pull secrets from Google Secret Manager.
# No longer needed for Cloud SQL Auth Proxy.
serviceAccount:
  create: true
  automountsatoken: true
  annotations:
    iam.gke.io/gcp-service-account: "SA_NAME@PROJECT_ID.iam.gserviceaccount.com"  # TODO: replace

# ── External Secrets Operator (Google Secret Manager) ──────────────
# Per official Tricentis docs, ESO manages ONLY DB credentials.
# All other secrets (OAuth, CSRF, session, Pulse, AES, Scenario)
# are created once via kubectl — see "kubectl create secret" below.
externalSecrets:
  enabled: true
  gcpProjectID: "PROJECT_ID"                    # TODO: replace
  clusterLocation: "REGION"                     # TODO: replace (e.g. us-central1)
  clusterName: "CLUSTER_NAME"                   # TODO: replace
  serviceAccountRef: "qtest-sa"                 # KSA name for ESO (must have WI binding)
  refreshInterval: "1h"                         # how often ESO syncs from GSM

  # ── Google Secret Manager secret names ────────────────────────────
  # Only DB passwords are managed via ESO (supports password rotation).
  remoteRefs:
    # Database (REQUIRED — create in GSM first)
    dbPassword: "qtest-db-password"                       # Cloud SQL password
    dbReadonlyPassword: "qtest-db-readonly-password"      # can be same as dbPassword

    # Insights i-ETL (all 4 keys default to same DB password)
    iEtlQtestDbPassword: "qtest-db-password"
    iEtlSessionsWriteDbPassword: "qtest-db-password"
    iEtlSessionsReadDbPassword: "qtest-db-password"
    iEtlInsightsDbPassword: "qtest-db-password"

# ── One-time kubectl secrets (run ONCE before helm install) ────────
# kubectl create secret generic qtest-manager-secret -n qtest \
#   --from-literal=oauth.app.sp.secret="{value}" \
#   --from-literal=oauth.app.sessions.secret="{value}" \
#   --from-literal=oauth.app.explorer.secret="{value}" \
#   --from-literal=oauth.app.qmap.secret="{value}" \
#   --from-literal=oauth.app.pulse.secret="{value}" \
#   --from-literal=jira.oauth2.password="{generated}" \
#   --from-literal=jira.oauth2.salt="{generated}" \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# kubectl patch secret qtest-manager-secret -n qtest --type merge \
#   -p='{"data":{"sessions.secret.key":"<BASE64>","csrfKey":"<BASE64>","csrf.secret.key":"<BASE64>","qtestPulseExecutorApiKey":"<BASE64>"}}'
#
# kubectl create secret generic qtest-aes-secret-keys -n qtest \
#   --from-literal=AESsecretKeys="$(openssl rand -base64 32)" \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# kubectl create secret generic qtest-scenario-secret -n qtest \
#   --from-literal=qTestScenarioRefreshTokenSecret="$(openssl rand -base64 32)" \
#   --from-literal=jiraCypherKey="$(openssl rand -base64 32)" \
#   --dry-run=client -o yaml | kubectl apply -f -

# ── Scheduling / Affinity ──────────────────────────────────────────
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - qtest-elasticsearch
          topologyKey: kubernetes.io/hostname

# ── qTest Manager ────────────────────────────────────────────────────
qTestManager:
  elasticSearch:
    disable: false
    init: true                                          # create ES indices on first boot
    host: "qtest-elasticsearch"
    scheme: http
    port: 9200

  # ── Attachment Storage ──────────────────────────────────────────
  # The chart's ConfigMap does NOT support a custom S3 endpoint,
  # so GCS HMAC interop is NOT viable. Use disk_storage with
  # a GCS FUSE CSI PVC (see persistence.existingClaim below).
  blobStorage:
    type: "disk_storage"

  # Internal service URLs for subcharts
  tdmSettingUrl: "http://qtest-parameters-service:5080"
  preSessionUrl: "https://sessions.gke.example.com"    # TODO: replace
  pulseUrlBase: "https://pulse.gke.example.com"        # TODO: replace
  launchUrlBase: "https://launch.gke.example.com"      # TODO: replace
  uiUrl: "https://qtest.gke.example.com"               # TODO: replace
  preUrl: "https://qtest.gke.example.com"              # TODO: replace
  preUrlHttps: "https://qtest.gke.example.com"         # TODO: replace

  # Database – connects directly to Cloud SQL via Private IP
  client:
    jdbc:
      postgresUrl: "jdbc:postgresql://CLOUD_SQL_PRIVATE_IP:5432/qtest"           # TODO: replace
      postgresUserName: "qtest_user"              # TODO: replace
      sessionsSchema: "public"
      postgresPassword: ""                         # injected from qtest-manager-secret
      postgresReadOnlyUrl: "jdbc:postgresql://CLOUD_SQL_PRIVATE_IP:5432/qtest"   # TODO: replace
      postgresReadOnlyUserName: "qtest_user"
      postgresReadOnlyPassword: ""

# ── Persistence (standard GCE Persistent Disk — ReadWriteOnce) ──────
# Single Manager pod → ReadWriteOnce is sufficient.
# GCE PD is provisioned automatically by GKE's default StorageClass.
# No GCS FUSE, no Filestore, no extra setup needed.
#
# ⚠️  If you later scale Manager beyond 1 replica you MUST switch to a
#     ReadWriteMany volume (Filestore NFS or GCS FUSE CSI) and update
#     persistence.storageClass accordingly.
persistence:
  enabled: true
  storageClass: "standard-rwo"    # GKE default GCE PD (ReadWriteOnce)
  size: 20Gi                      # adjust to your attachment volume needs

# ── Istio VirtualService ─────────────────────────────────────────────
istio:
  enabled: true
  sessionAffinity: true                              # JSESSIONID sticky sessions for scaled pods
  gateway: "qtest/qtest-gateway"                   # existing Gateway resource
  hosts:
    - "qtest.gke.example.com"                      # TODO: replace
    - "launch.gke.example.com"                     # TODO: replace
    - "insights.gke.example.com"                   # TODO: replace
    - "parameters.gke.example.com"                 # TODO: replace
    - "scenario.gke.example.com"                   # TODO: replace
    - "sessions.gke.example.com"                   # TODO: replace
    - "pulse.gke.example.com"                      # TODO: replace

ingress:
  enabled: false

# ── Internal Service Configuration ──────────────────────────────────
service:
  type: ClusterIP

# ── Autoscaling — capped at 1 replica (ReadWriteOnce PVC constraint) ─
# Manager uses a GCE PD (ReadWriteOnce). Scaling beyond 1 replica would
# cause pod scheduling failures as the PD can only attach to one node.
# Remove this block and switch to ReadWriteMany storage before scaling.
autoscaling:
  enabled: false
  minReplicas:
    ui: 1
    api: 1
    notification: 1
    poller: 1
  maxReplicas:
    ui: 1
    api: 1
    notification: 1
    poller: 1

# ── Liquibase Migration Job ──────────────────────────────────────────
# Liquibase connects directly to Cloud SQL Private IP — no sidecar needed.
liquibase:
  enabled: true

# ── qTest Launch ─────────────────────────────────────────────────────
qtest-launch:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
  serviceAccount:
    create: true
    automountServiceAccountToken: true
    annotations:
      iam.gke.io/gcp-service-account: "SA_NAME@PROJECT_ID.iam.gserviceaccount.com"  # TODO
  qTestLaunch:
    qTestLaunchDBHostName: "CLOUD_SQL_PRIVATE_IP"       # TODO: replace
    qTestLaunchDBPort: "5432"
    qTestLaunchDBUserName: "qtest_user"
    qTestLaunchTCPWD: ""                           # inject via Secret
    qTestLaunchRootURL: "https://launch.gke.example.com" # TODO
    qTestLaunchQTestURL: "https://qtest.gke.example.com" # TODO

# ── qTest Insights ───────────────────────────────────────────────────
qtest-insights:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
  serviceAccount:
    create: true
    automountServiceAccountToken: true
    annotations:
      iam.gke.io/gcp-service-account: "SA_NAME@PROJECT_ID.iam.gserviceaccount.com"  # TODO
  qTestInsights:
    qTestInsightsDBHost: "CLOUD_SQL_PRIVATE_IP"         # TODO: replace
    qTestInsightsDBPort: 5432
    qTestInsightsDBUser: "qtest_user"
    qTestInsightsWriteQTestDBHost: "CLOUD_SQL_PRIVATE_IP"     # TODO: replace
    qTestInsightsWriteQTestDBUser: "qtest_user"
    qTestInsightsSessionDBHost: "CLOUD_SQL_PRIVATE_IP"        # TODO: replace
    qTestInsightsSessionDBUser: "qtest_user"

# ── qTest Parameters (TDM) ─────────────────────────────────────────
qtest-parameters:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
  serviceAccount:
    create: true
    automountsatoken: true
    annotations:
      iam.gke.io/gcp-service-account: "SA_NAME@PROJECT_ID.iam.gserviceaccount.com"  # TODO
  qTestParameters:
    qTestParametersDBName: "parameters"
    qTestParametersDBUserName: "qtest_user"
    qTestParametersDBHostName: "CLOUD_SQL_PRIVATE_IP"   # TODO: replace
    qTestParametersDBPort: "5432"
    qTestParametersQTestHost: "https://qtest.gke.example.com"  # TODO: replace
    qTestParametersNodeTLSRejectUnAuthorized: "0"
    qTestParametersNodeEnv: production
    qTestParametersCorsOrigin: "gke.example.com"     # TODO: replace with your domain
    qTestParametersDeploymentEnv: "onpremise"
    qTestParametersSSLRequired: false
    qTestParametersDBSSLEnable: false

# ── qTest Scenario ───────────────────────────────────────────────────
qtest-scenario:
