    type: ClusterIP
  ingress:
    enabled: false
  serviceAccount:
    create: true
    automountServiceAccountToken: true
    annotations:
      iam.gke.io/gcp-service-account: "SA_NAME@PROJECT_ID.iam.gserviceaccount.com"  # TODO
  qTestScenario:
    qTestScenarioDBHostName: "CLOUD_SQL_PRIVATE_IP"     # TODO: replace
    qTestScenarioDBPort: "5432"
    qTestScenarioDBUserName: "qtest_user"
    qTestScenarioLocalBaseURL: "https://scenario.gke.example.com" # TODO
    qTestScenarioQTestURL: "https://qtest.gke.example.com" # TODO

# ── qTest Session ───────────────────────────────────────────────────
qtest-session:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
  serviceAccount:
    create: true
    # NOTE: this chart uses the non-standard key 'automountsatoken' (same as qtest-mgr).
    automountsatoken: true
    annotations:
      iam.gke.io/gcp-service-account: "SA_NAME@PROJECT_ID.iam.gserviceaccount.com"  # TODO
  qTestSession:
    qTestSessionDBName: "sessions"
    qTestSessionDBUserName: "qtest_user"
    qTestSessionDBHostName: "CLOUD_SQL_PRIVATE_IP"      # TODO: replace
    qTestSessionDBPort: "5432"
    qTestManagerHost: "https://qtest.gke.example.com"  # TODO: replace
    qTestSessionStorageType: "disk_storage"
    qTestSessionStorageRootPath: "/data"
    qTestStorageBucketName: ""
    qTestSessionClamavURL: ""
    qTestSessionSSLRequired: false
    qTestSessionDBSSLEnable: false
    qTestSessionDeploymentEnv: "op"

# ── qTest Pulse ──────────────────────────────────────────────────────
qtest-pulse:
