{{- if .Values.externalSecrets.enabled }}
# ── ClusterSecretStore for Google Secret Manager ───────────────────
# Authenticates to GSM via GKE Workload Identity.
# The KSA used by ESO's controller must be bound to a GSA with
# roles/secretmanager.secretAccessor on the target secrets.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: {{ .Values.namespace.name }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.externalSecrets.gcpProjectID | quote }}
      {{- if .Values.externalSecrets.serviceAccountRef }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.externalSecrets.clusterLocation | quote }}
          clusterName: {{ .Values.externalSecrets.clusterName | quote }}
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccountRef }}
      {{- end }}
{{- end }}
