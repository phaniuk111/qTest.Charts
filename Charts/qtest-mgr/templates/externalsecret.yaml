{{- if .Values.externalSecrets.enabled }}
# ═══════════════════════════════════════════════════════════════════
# ExternalSecret: qtest-manager-secret
# ═══════════════════════════════════════════════════════════════════
# Maps individual Google Secret Manager secrets → one K8s Secret.
# Only compulsory secrets are included by default.
# Optional OAuth/integration secrets can be enabled via values.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qtest-manager-secret-es
  namespace: {{ .Values.namespace.name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: qtest-manager-secret
    creationPolicy: Owner
  data:
    # ── Database Credentials (REQUIRED) ─────────────────────────────
    - secretKey: client.jdbc.postgres.password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.dbPassword | default "qtest-db-password" }}
    - secretKey: client.jdbc.postgres.readonly.password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.dbReadonlyPassword | default "qtest-db-readonly-password" }}

    # ── Jira OAuth2 (REQUIRED — qTest won't start without these) ───
    - secretKey: jira.oauth2.password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.jiraOauth2Password | default "qtest-jira-oauth2-password" }}
    - secretKey: jira.oauth2.salt
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.jiraOauth2Salt | default "qtest-jira-oauth2-salt" }}

    # ── Session & CSRF Keys (REQUIRED) ──────────────────────────────
    - secretKey: sessions.secret.key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.sessionsSecretKey | default "qtest-sessions-secret-key" }}
    - secretKey: csrfKey
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.csrfKey | default "qtest-csrf-key" }}
    - secretKey: csrf.secret.key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.csrfSecretKey | default "qtest-csrf-secret-key" }}

    # ── Pulse Executor API Key (REQUIRED) ───────────────────────────
    - secretKey: qtestPulseExecutorApiKey
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.pulseExecutorApiKey | default "qtest-pulse-executor-api-key" }}

    # ── Optional OAuth App Secrets (enable via values if needed) ────
    {{- if .Values.externalSecrets.remoteRefs.oauthSpSecret }}
    - secretKey: oauth.app.sp.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthSpSecret }}
    {{- end }}
    {{- if .Values.externalSecrets.remoteRefs.oauthSessionsSecret }}
    - secretKey: oauth.app.sessions.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthSessionsSecret }}
    {{- end }}
    {{- if .Values.externalSecrets.remoteRefs.oauthExplorerSecret }}
    - secretKey: oauth.app.explorer.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthExplorerSecret }}
    {{- end }}
    {{- if .Values.externalSecrets.remoteRefs.oauthQmapSecret }}
    - secretKey: oauth.app.qmap.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthQmapSecret }}
    {{- end }}
    {{- if .Values.externalSecrets.remoteRefs.oauthJenkinsSecret }}
    - secretKey: oauth.app.jenkins.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthJenkinsSecret }}
    {{- end }}
    {{- if .Values.externalSecrets.remoteRefs.oauthBambooSecret }}
    - secretKey: oauth.app.bamboo.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthBambooSecret }}
    {{- end }}
    {{- if .Values.externalSecrets.remoteRefs.oauthPulseSecret }}
    - secretKey: oauth.app.pulse.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthPulseSecret }}
    {{- end }}
    {{- if .Values.externalSecrets.remoteRefs.oauthToscaSecret }}
    - secretKey: oauth.app.tosca.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthToscaSecret }}
    {{- end }}
    {{- if .Values.externalSecrets.remoteRefs.oauthWebExplorerSecret }}
    - secretKey: oauth.app.web-explorer.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthWebExplorerSecret }}
    {{- end }}

    # ── Optional Integration Keys (enable via values if needed) ─────
    {{- if .Values.externalSecrets.remoteRefs.mailPassword }}
    - secretKey: mail.password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.mailPassword }}
    {{- end }}
    {{- if .Values.externalSecrets.remoteRefs.launchdarklySdkKey }}
    - secretKey: launchdarkly.sdkKey
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.launchdarklySdkKey }}
    - secretKey: launchdarkly-sdkKey
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.launchdarklySdkKey }}
    {{- end }}
---
# ═══════════════════════════════════════════════════════════════════
# ExternalSecret: qtest-aes-secret-keys
# ═══════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qtest-aes-secret-keys-es
  namespace: {{ .Values.namespace.name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: qtest-aes-secret-keys
    creationPolicy: Owner
  data:
    - secretKey: AESsecretKeys
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.aesSecretKeys | default "qtest-aes-secret-keys" }}
---
# ═══════════════════════════════════════════════════════════════════
# ExternalSecret: qtest-scenario-secret
# ═══════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qtest-scenario-secret-es
  namespace: {{ .Values.namespace.name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: qtest-scenario-secret
    creationPolicy: Owner
  data:
    - secretKey: qTestScenarioRefreshTokenSecret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.scenarioRefreshTokenSecret | default "qtest-scenario-refresh-token-secret" }}
    - secretKey: jiraCypherKey
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.jiraCypherKey | default "qtest-jira-cypher-key" }}
---
# ═══════════════════════════════════════════════════════════════════
# ExternalSecret: qtest-i-etl-secret
# ═══════════════════════════════════════════════════════════════════
# Maps DB credentials for the Insights i-ETL service from GSM.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qtest-i-etl-secret-es
  namespace: {{ .Values.namespace.name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: qtest-i-etl-secret
    creationPolicy: Owner
  data:
    - secretKey: qtestDbPassword
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.iEtlQtestDbPassword | default "qtest-db-password" }}
    - secretKey: sessionsWriteDbPassword
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.iEtlSessionsWriteDbPassword | default "qtest-db-password" }}
    - secretKey: sessionsReadDbPassword
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.iEtlSessionsReadDbPassword | default "qtest-db-password" }}
    - secretKey: insightsDbPassword
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.iEtlInsightsDbPassword | default "qtest-db-password" }}
{{- end }}
