{{- if .Values.externalSecrets.enabled }}
# ═══════════════════════════════════════════════════════════════════
# ExternalSecret: qtest-manager-secret
# ═══════════════════════════════════════════════════════════════════
# All secrets managed via ESO / Google Secret Manager.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qtest-manager-secret-es
  namespace: {{ .Values.namespace.name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: qtest-manager-secret
    creationPolicy: Owner
  data:
    # ── Database Credentials ────────────────────────────────────────
    - secretKey: client.jdbc.postgres.password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.dbPassword | default "qtest-db-password" }}
    - secretKey: client.jdbc.postgres.readonly.password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.dbReadonlyPassword | default "qtest-db-readonly-password" }}

    # ── OAuth App Secrets ───────────────────────────────────────────
    - secretKey: oauth.app.sp.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthSpSecret | default "qtest-oauth-sp-secret" }}
    - secretKey: oauth.app.sessions.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthSessionsSecret | default "qtest-oauth-sessions-secret" }}
    - secretKey: oauth.app.explorer.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthExplorerSecret | default "qtest-oauth-explorer-secret" }}
    - secretKey: oauth.app.qmap.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthQmapSecret | default "qtest-oauth-qmap-secret" }}
    - secretKey: oauth.app.pulse.secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.oauthPulseSecret | default "qtest-oauth-pulse-secret" }}

    # ── Jira OAuth2 (required — qTest won't start without these) ───
    - secretKey: jira.oauth2.password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.jiraOauth2Password | default "qtest-jira-oauth2-password" }}
    - secretKey: jira.oauth2.salt
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.jiraOauth2Salt | default "qtest-jira-oauth2-salt" }}

    # ── Session & CSRF Keys ─────────────────────────────────────────
    - secretKey: sessions.secret.key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.sessionsSecretKey | default "qtest-sessions-secret-key" }}
    - secretKey: csrfKey
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.csrfKey | default "qtest-csrf-key" }}
    - secretKey: csrf.secret.key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.csrfSecretKey | default "qtest-csrf-secret-key" }}

    # ── Pulse Executor API Key ──────────────────────────────────────
    - secretKey: qtestPulseExecutorApiKey
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.pulseExecutorApiKey | default "qtest-pulse-executor-api-key" }}
---
# ═══════════════════════════════════════════════════════════════════
# ExternalSecret: qtest-aes-secret-keys
# ═══════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qtest-aes-secret-keys-es
  namespace: {{ .Values.namespace.name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: qtest-aes-secret-keys
    creationPolicy: Owner
  data:
    - secretKey: AESsecretKeys
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.aesSecretKeys | default "qtest-aes-secret-keys" }}
---
# ═══════════════════════════════════════════════════════════════════
# ExternalSecret: qtest-scenario-secret
# ═══════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qtest-scenario-secret-es
  namespace: {{ .Values.namespace.name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: qtest-scenario-secret
    creationPolicy: Owner
  data:
    - secretKey: qTestScenarioRefreshTokenSecret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.scenarioRefreshTokenSecret | default "qtest-scenario-refresh-token-secret" }}
    - secretKey: jiraCypherKey
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.jiraCypherKey | default "qtest-jira-cypher-key" }}
---
# ═══════════════════════════════════════════════════════════════════
# ExternalSecret: qtest-i-etl-secret
# ═══════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qtest-i-etl-secret-es
  namespace: {{ .Values.namespace.name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: qtest-i-etl-secret
    creationPolicy: Owner
  data:
    - secretKey: qtestDbPassword
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.iEtlQtestDbPassword | default "qtest-db-password" }}
    - secretKey: sessionsWriteDbPassword
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.iEtlSessionsWriteDbPassword | default "qtest-db-password" }}
    - secretKey: sessionsReadDbPassword
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.iEtlSessionsReadDbPassword | default "qtest-db-password" }}
    - secretKey: insightsDbPassword
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.iEtlInsightsDbPassword | default "qtest-db-password" }}
{{- end }}
